# /etc/nginx/nginx.conf
# Nginx main configuration file on r04
# generated: 2025-04-18
# Ansible managed manual changes will be overwritten!

user              www-data;
worker_processes  "2";
pid               /run/nginx.pid;
error_log         /var/log/nginx/error.log warn;

include           /etc/nginx/modules-enabled/*.conf;


events {
    worker_connections  1024;
    multi_accept        off;
}

http {
    ##
    # Basic Settings
    ##

    sendfile                      on;
    tcp_nopush                    on;
    tcp_nodelay                   on;
    types_hash_max_size           2048;
    keepalive_timeout             75;
    keepalive_requests            600;
    server_tokens                 off;
    server_names_hash_bucket_size 64;
    server_name_in_redirect       off;
    client_max_body_size          64m;
    default_type                  application/octet-stream;

    ##
    # SSL Settings
    ##
    ssl_protocols                 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers     on;
    ssl_ciphers                   'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384: ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    ##
    # Logging Settings
    ##
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log      /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log       /var/log/nginx/error.log warn;

    ##
    # Gzip Compression Settings
    ##
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_buffers      16 8k;
    gzip_comp_level   8;
    gzip_http_version 1.1;
    gzip_min_length   50;
    gzip_types        application/atom+xml application/javascript application/json application/rss+xml application/vnd.ms-fontobject application/x-font-opentype application/x-font-ttf application/x-javascript application/xhtml+xml application/xml ap>
    gzip_disable      "msie6";

    ##
    # Cache Settings
    ##


    ##
    # Includes
    ##
    include /etc/nginx/mime.types;            # Include mime types
    include /etc/nginx/conf.d/*.conf;     # Include global configurations, if any
    include /etc/nginx/sites-enabled/*;         # Include drupal site vhosts
}