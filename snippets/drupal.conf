# /etc/nginx/snippets/drupal.conf
# Nginx drupal configuration file on r04
# generated: 2025-04-18
# Ansible managed, manual changes will be overwritten!

#######################################################
###  Common Drupal config for Nginx
###  This file is included in server blocks and used for all Drupal sites
#######################################################

# Disable directory listing
autoindex off;

# Favicon and robots.txt: disable logging for missing files
location = /favicon.ico {
  log_not_found off;
  access_log off;
}
location = /robots.txt {
  allow all;
  log_not_found off;
  access_log off;
}

# Allow Well-Known URIs per RFC 5785
location ~* ^/.well-known/ {
  allow all;
}

# Catch-all rule for any hidden files or directories
location ~ (^|/)\. {
  deny all;
}

# Main location: try to serve file directly, fallback to index.php
location / {
  try_files $uri /index.php?$query_string;
}

# Rewrite block used as named fallback for static file attempts
location @rewrite {
  rewrite ^ /index.php last;
}

# PHP processing: forward PHP requests to FastCGI
location ~ \.php$|^/update.php {
  include snippets/fastcgi-php.conf;                                # Parameter passed to the FastCGI server
  include fastcgi_params;
  fastcgi_pass unix:/run/php/php8.3-fpm.sock;                       # address of the FastCGI server, as unix socket path
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # the script name to be executed by PHP
  fastcgi_param HTTP_PROXY      "";                                 # Block httpoxy attacks. See https://httpoxy.org/.
  fastcgi_param QUERY_STRING    $query_string;                      # pass request parameters to PHP
  fastcgi_intercept_errors      on;                                 # passing FastCGI server responses (300 or higher) to clients
}

# Static file handling: cache assets and fallback to rewrite if not found
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|pdf)$ {
  try_files $uri @rewrite;
  expires max;
  log_not_found off;
}

# Specific handling for Drupal image styles
location ~ ^/sites/.*/files/styles/ {
  try_files $uri @rewrite;
}

# Handling for system files potentially prefixed with language code
location ~ ^(/[a-z\-]+)?/system/files/ {
  try_files $uri /index.php?$query_string;
}

# Redirect any URL containing /index.php/ to a cleaner URL
rewrite ^(.*/)index\.php/(.*)$ $1$2 redirect;

#######################################################
###  End Common Drupal config
#######################################################